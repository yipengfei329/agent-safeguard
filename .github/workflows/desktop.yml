name: Desktop checks
on:
  push:
    paths: ['desktop/**', 'src/**', 'hooks/**', 'config/**', 'schemas/**', 'scripts/build.mjs', 'package*.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'src/**', 'hooks/**', 'config/**', 'schemas/**', 'scripts/build.mjs', 'package*.json', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libxcb1-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libudev-dev
      - run: npm ci
      - run: npm test
      - run: cargo test --release --locked --manifest-path desktop/Cargo.toml
      - run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/target/release/agent-safeguard-desktop
            desktop/target/release/agent-safeguard-desktop.exe
          if-no-files-found: error
