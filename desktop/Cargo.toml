[package]
name = "agent-safeguard-desktop"
version = "0.3.5"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
rquickjs = "0.11"
fs2 = "0.4"
sha2 = "0.10"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
